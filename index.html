<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه اینترنتی ۱۹کالا</title>
    <link rel="stylesheet" href="style.css">
    <!-- فراخوانی فونت وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <!-- هدر سایت -->
    <header class="site-header">
        <div class="container header-inner">
            <div class="logo">
                <img src="images/logo.png" alt="۱۹کالا">
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="#">گوشی موبایل</a></li>
                    <li><a href="#">اسپیکر</a></li>
                    <li><a href="#">هدفون و هندزفری</a></li>
                    <li><a href="#">تیلت</a></li>
                    <li><a href="#">ساعت هوشمند</a></li>
                </ul>
            </nav>
            <div class="header-icons">
                <!-- آیکون‌ها -->
                <span>🛒</span>
                <span>👤</span>
            </div>
        </div>
    </header>

    <!-- بنر اصلی -->
    <section class="hero-banner container">
        <img src="images/header-banner.jpg" alt="تخفیف پاییزه">
    </section>

    <!-- نوار خدمات -->
    <section class="services container">
        <div class="service-item">🎁 ضمانت اصالت</div>
        <div class="service-item">🚚 ارسال اکسپرس</div>
        <div class="service-item">📅 ۷ روز ضمانت</div>
        <div class="service-item">🔍 رجیستری</div>
    </section>

    <!-- مجله ۱۹کالا -->
    <section class="magazine container">
        <div class="magazine-box">
            <h3>مجله تخصصی ۱۹کالا</h3>
            <button>مشاهده مقالات</button>
        </div>
    </section>

    <!-- محصولات -->
    <section class="products container">
        <h2>تخفیف ویژه</h2>
        <div class="product-grid">
            <!-- کارت محصول ۱ -->
            <div class="product-card">
                <img src="images/product-1.jpg" alt="گوشی">
                <h3>نام گوشی</h3>
                <p>قیمت</p>
            </div>
            <!-- کارت محصول ۲ -->
            <div class="product-card">
                <img src="images/product-2.jpg" alt="گوشی">
                <h3>نام گوشی</h3>
                <p>قیمت</p>
            </div>
        </div>
    </section>
</body>
</html>
